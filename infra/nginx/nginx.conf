events {}

http {
    upstream auth_service {
        server auth-service:8000;
    }

    upstream agent_orchestrator {
        server agent-orchestrator:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_service/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /_auth_verify {
            internal;
            proxy_pass http://auth_service/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /api/v1/run {
            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_email $upstream_http_x_user_email;
            auth_request_set $auth_user_role $upstream_http_x_user_role;
            auth_request_set $auth_user_scopes $upstream_http_x_user_scopes;

            proxy_pass http://agent_orchestrator/api/v1/run;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Email $auth_user_email;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header X-User-Scopes $auth_user_scopes;
        }

        location /api/v1/ {
            auth_request /_auth_verify;
            proxy_pass http://agent_orchestrator/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

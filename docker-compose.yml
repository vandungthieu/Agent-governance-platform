services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-governance-postgres
    environment:
      POSTGRES_DB: agent_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_governance"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: agent-governance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  auth-service:
    build:
      context: ./service/auth-service
    container_name: agent-governance-auth-service
    environment:
      PROJECT_NAME: auth-service
      API_V1_STR: /api/v1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: agent_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      DATABASE_ECHO: "false"
      JWT_SECRET_KEY: change-this-secret-in-production-at-least-32-chars
      JWT_ISSUER: agent-governance-auth
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DEFAULT_USER_ROLE: employee
      DEFAULT_USER_SCOPES: "agent:run customer:read"
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  agent-orchestrator:
    build:
      context: ./service/agent-orchestrator
    container_name: agent-governance-agent-orchestrator
    environment:
      PROJECT_NAME: agent-orchestrator
      API_V1_STR: /api/v1
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b-instruct
      LLM_TIMEOUT_SECONDS: 180
      EMBEDDING_PROVIDER: ollama
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSIONS: 768
      EMBEDDING_TIMEOUT_SECONDS: 120
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: agent_governance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me
      DATABASE_ECHO: "false"
      WEB_SEARCH_ENABLED: "true"
      WEB_SEARCH_TIMEOUT_SECONDS: 10
      WEB_SEARCH_MAX_RESULTS: 5
      SUPERMEMORY_ENABLED: "false"
      SUPERMEMORY_API_KEY: ""
      SUPERMEMORY_BASE_URL: https://api.supermemory.ai
      SUPERMEMORY_TIMEOUT_SECONDS: 15
      SUPERMEMORY_CONTAINER_PREFIX: agent-governance
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  telegram-adapter:
    build:
      context: ./service/telegram-adapter
    container_name: agent-governance-telegram-adapter
    environment:
      PROJECT_NAME: telegram-adapter
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AGENT_API_URL: http://agent-orchestrator:8000/api/v1/run
      AGENT_API_BEARER_TOKEN: ""
      HTTP_TIMEOUT_SECONDS: 300
    ports:
      - "8003:8000"
    depends_on:
      - agent-orchestrator

  nginx:
    image: nginx:1.27-alpine
    container_name: agent-governance-nginx
    ports:
      - "8088:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - agent-orchestrator
      - telegram-adapter

volumes:
  postgres_data:
  ollama_data:
